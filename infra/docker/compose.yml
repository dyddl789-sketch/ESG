name: esg

services:
  redis:
    image: redis:7.4.9-alpine
    container_name: esg-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - esg-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  esg-redis-data:
    name: esg-redis-data
