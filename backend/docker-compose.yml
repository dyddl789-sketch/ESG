services:
  postgres:
    image: postgres:16
    container_name: esg-postgres
    environment:
      POSTGRES_DB: esg
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: esg-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: