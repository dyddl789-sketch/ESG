spring:
  application:
    name: esg-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID:change-me}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mybatis/mappers/**/*.xml
  type-aliases-package: com.esg.platform.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  jwt:
    # 개발 편의를 위한 기본값입니다. 운영 환경에서는 반드시 JWT_SECRET 환경변수로 교체하세요.
    secret: ${JWT_SECRET:ZXNnLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2LTA3LTA4}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:14d}
  auth:
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:ESG_REFRESH_TOKEN}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-failure-window: ${LOGIN_FAILURE_WINDOW:10m}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
    oauth-code-expiration: ${OAUTH_CODE_EXPIRATION:60s}

logging:
  level:
    root: INFO
    com.esg.platform: INFO
    org.springframework.security: INFO
