version: "3.8"

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: esg-postgis

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network



  redis:
    image: redis:7-alpine
    container_name: esg-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: spring-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    volumes:
      - upload_data:/home/ubuntu/upload/evidence

    networks:
      - app-network



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: nginx-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - app-network



volumes:

  postgres_data:
  redis_data:
  upload_data:



networks:

  app-network:
    driver: bridge